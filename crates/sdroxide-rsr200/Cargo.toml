[package]
name = "sdroxide-rsr200"
version.workspace = true
edition.workspace = true

# Reuter RSR200(B) support. `protocol` and `device` are pure logic with no
# I/O and no sdroxide-types dependency (see `protocol`'s own doc) -- the
# only two pieces that needed neither. `lan`, `usb`, `stream` and `handle`
# are the real backend: two transports, a worker thread, and the public API
# src/rsr200_source.rs (outside this crate) calls.
[dependencies]
crossbeam-channel.workspace = true
libloading.workspace = true
num-complex.workspace = true
rtrb.workspace = true
sdroxide-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
